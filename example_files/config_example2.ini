[defaults]
header_row_num = 0
separator = ,

[sources]
example3 = example_files/example3.csv
example = example_files/example.csv

[example3]
target_columns = employment status,social security,favorite color
join_by_columns = social security
header_row_num = 1
ignore_rows = 2,5,6

[example]
target_columns = Employment Status,Favorite Color,Social Security Number
join_by_columns = Social Security Number

[example_column_remapping]
Employment Status = employment status
Favorite Color = favorite color
Social Security Number = social security

[output]
dialect = csv

[output_filters]
employment status = ^([eE]|[uU]ne)mployed$
social security = ^\d+$
