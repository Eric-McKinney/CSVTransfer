# default values given to each source's section
[defaults]
header_row_num = 0
ignore_rows = -1

# specify pairs of source name and path to the respective csv file
# paths can be relative but bear in mind it will be relative to where the script is run
[sources]
source1 = /path/to/data1.csv
source2 = ./data2.csv

# section name should match name of source given in sources section above
# specify columns by header/name to pull data from in the source csv
# optionally specify column header(s)/name(s) to join data by in the output
[source1]
target_columns = id,name,email,favorite food
join_by_columns = id,name

# section name should match name of source given in sources section + _column_remapping
# specify columns from the source which go columns in the output with a different name
# formatted as:
# source_column_name = output_column_name
[source1_column_remapping]
name = first name

[source2]
target_columns = employee id,first name,last name
join_by_columns = employee_id,first name
header_row_num = 1
ignore_rows = 3,5

[source2_column_remapping]
employee id = id

# specify output file name and output dialect (unix, excel, excel_tab)
[output]
file_name = output.csv
dialect = excel

# specify regex filters to flag data in the output if it does not match
[output_filters]
id = ^[0-9]{10}$
